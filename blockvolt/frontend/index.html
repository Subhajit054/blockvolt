<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BlockVolt</title>

<link rel="stylesheet" href="css/style.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.6.2/dist/ethers.min.js"></script>

</head>

<body>

<!-- 3D BACKGROUND -->
<div id="three-container"></div>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="logo">BlockVolt</div>
  <button onclick="connectWallet()" class="connect-btn">Connect Wallet</button>
</nav>

<!-- HERO -->
<section class="hero">

  <div class="hero-left">
    <h1>
      Secure Your Documents <br>
      <span>On Blockchain</span>
    </h1>

    <p>
      Store, verify and access your important documents securely using decentralized blockchain.
    </p>

    <button class="primary-btn">Get Started</button>
  </div>

  <!-- VIDEO SLIDER -->
  <div class="hero-right">

    <video class="slide active" autoplay muted loop>
      <source src="assets/video/banner1.mp4">
    </video>

    <video class="slide" autoplay muted loop>
      <source src="assets/video/banner2.mp4">
    </video>

    <video class="slide" autoplay muted loop>
      <source src="assets/video/banner3.mp4">
    </video>

    <video class="slide" autoplay muted loop>
      <source src="assets/video/banner4.mp4">
    </video>

    <video class="slide" autoplay muted loop>
      <source src="assets/video/banner5.mp4">
    </video>

  </div>

</section>

<!-- STATS -->
<section class="stats">

  <div class="stat-box">
    <h2>10K+</h2>
    <p>Documents Stored</p>
  </div>

  <div class="stat-box">
    <h2>5K+</h2>
    <p>Users</p>
  </div>

  <div class="stat-box">
    <h2>100%</h2>
    <p>Secure</p>
  </div>

</section>

<!-- QUICK ACCESS -->
<section class="section">

  <h2>Quick Access</h2>

  <div class="grid">
    <div class="card">📄 Aadhaar</div>
    <div class="card">💳 PAN</div>
    <div class="card">🚗 License</div>
    <div class="card">🌍 Passport</div>
  </div>

</section>

<!-- VAULT -->
<section class="section">

  <h2>Your Vault</h2>

  <div class="grid">
    <div class="card">⬆ Upload</div>
    <div class="card">👁 View</div>
    <div class="card">✔ Verify</div>
    <div class="card">🔗 Share</div>
  </div>

</section>

<script src="js/three-bg.js"></script>
<script src="js/slider.js"></script>
<script src="js/wallet.js"></script>

</body>
</html>
